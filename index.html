      --accent-soft: #e0f2fe;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --bad: #b91c1c;

      --radius: 12px;

      color: var(--ink);
      line-height: 1.45;

    .topbar {

      color: #fff;

      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-box { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0ea5e9, #16a34a);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-title { font-size: 16px; font-weight: 700; margin: 0; }
    .brand-sub { font-size: 12px; color: #cbd5e1; margin: 0; }

    .session-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
    }
    .pill-ok {
      background: rgba(22, 163, 74, 0.22);
      border-color: rgba(74, 222, 128, 0.45);
      color: #dcfce7;
      font-weight: 600;
    }
    .topbar select, .topbar input {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
    }
    .topbar input[type="number"] { width: 102px; }

    button {
      cursor: pointer;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
    }
    button:hover { background: #f1f5f9; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #0369a1; }
    button.success { background: var(--ok); border-color: var(--ok); color: #fff; }
    button.warn { background: var(--warn); border-color: var(--warn); color: #fff; }
    button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
    button.sm { padding: 5px 9px; font-size: 12px; }

    function normalizeRateHistory(rawList, fallbackRate) {
      var list = Array.isArray(rawList) ? rawList.slice() : [];
      var clean = [];
      var seenDates = {};
      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        if (!item || !item.date) continue;
        var dt = String(item.date).trim();
        var r = parseFloat(item.rateBs);
        if (!dt || isNaN(r) || r <= 0) continue;
        if (seenDates[dt]) continue;
        seenDates[dt] = true;
        clean.push({
          date: dt,
          rateBs: Number(r.toFixed(4)),
          updatedAt: String(item.updatedAt || "08:00"),
          updatedBy: String(item.updatedBy || "Sistema")
        });
      }
      var today = getTodayIsoDate();
      var baseRate = (!isNaN(parseFloat(fallbackRate)) && parseFloat(fallbackRate) > 0) ? Number(parseFloat(fallbackRate).toFixed(4)) : 48.5000;
      if (!seenDates[today]) {
        clean.push({
          date: today,
          rateBs: baseRate,
          updatedAt: getNowTimeStr(),
          updatedBy: "Sistema"
        });
      }
      clean.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      return clean;
    }

    function recordDailyRate(dateStr, newRateBs, userName) {
      var dt = String(dateStr || getTodayIsoDate()).trim();
      var val = parseFloat(newRateBs);
      if (!dt || isNaN(val) || val <= 0) return null;
      var rounded = Number(val.toFixed(4));
      var who = String(userName || (getUser() && getUser().name) || "Administrador");
      var timeNow = getNowTimeStr();
      var list = normalizeRateHistory(state.rateHistory, rounded);
      var found = false;
      for (var i = 0; i < list.length; i++) {
        if (list[i].date === dt) {
          list[i].rateBs = rounded;
          list[i].updatedAt = timeNow;
          list[i].updatedBy = who;
          found = true;
          break;
        }
      }
      if (!found) {
        list.push({ date: dt, rateBs: rounded, updatedAt: timeNow, updatedBy: who });
      }
      list.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      state.rateHistory = list;

      var today = getTodayIsoDate();
      if (dt === today || !list.some(function (x) { return x.date === today; })) {
        state.rateBs = rounded;
      } else {
        for (var j = 0; j < list.length; j++) {
          if (list[j].date === today) {
            state.rateBs = Number(list[j].rateBs);
            break;
          }
        }
      }
      return { date: dt, rateBs: rounded, updatedAt: timeNow, updatedBy: who };
    }

    function deleteRateHistoryEntry(dateStr) {
      var dt = String(dateStr || "").trim();
      var list = normalizeRateHistory(state.rateHistory, state.rateBs);
      var today = getTodayIsoDate();
      if (dt === today) {
        return { ok: false, error: "No puede eliminar la tasa del día actual (" + dt + "). Puede modificarla en su lugar." };
      }
      if (list.length <= 1) {
        return { ok: false, error: "Debe mantenerse al menos un registro en el historial de tasas." };
      }
      var filtered = list.filter(function (x) { return x.date !== dt; });
      if (filtered.length === list.length) {
        return { ok: false, error: "No se encontró el registro de la fecha " + dt + "." };
      }
      state.rateHistory = filtered;
      return { ok: true };
    }

    function normalizeLoadedState(p) {
      var b = defaultState();
      if (!p || typeof p !== "object" || !Array.isArray(p.invoices) || !Array.isArray(p.lots)) return b;
      var mergedCompany = Object.assign({}, DEFAULT_COMPANY, p.company || {});
      var mergedUsers = Array.isArray(p.users) && p.users.length
        ? p.users.map(function (u) {
            var fallbackPerms = (ROLE_PERMS[u.role] || ROLE_PERMS.Vendedor).slice();
            var uPerms = Array.isArray(u.perms) ? u.perms.slice() : fallbackPerms;
            if (u.role === "Administrador" && uPerms.indexOf("administracion") === -1) {
              uPerms.push("administracion");
            }
            return Object.assign({ password: "1234", phone: "", email: "", active: true }, u, { perms: uPerms });
          })
        : cloneDefaultUsers();
      var mergedCrateTypes = Array.isArray(p.crateTypes) && p.crateTypes.length
        ? p.crateTypes.map(function (ct) { return { id: String(ct.id), name: String(ct.name || ct.id) }; })
        : b.crateTypes;
      var mergedClients = Array.isArray(p.clients) && p.clients.length ? p.clients.map(function (c) {
        return Object.assign({ clientType: "Normal" }, c);
      }) : b.clients;
      var mergedSkus = Array.isArray(p.skus) && p.skus.length ? p.skus.map(function (s) {
        var pBy = Object.assign({ Normal: Number(s.priceUsd || 0), Mayorista: Number(s.priceUsd || 0), Distribuidor: Number(s.priceUsd || 0) }, s.pricesByType || {});
        return Object.assign({}, s, { pricesByType: pBy });
      }) : b.skus;

      var rateVal = (!isNaN(parseFloat(p.rateBs)) && parseFloat(p.rateBs) > 0) ? Number(parseFloat(p.rateBs).toFixed(4)) : b.rateBs;
      var histVal = normalizeRateHistory(p.rateHistory, rateVal);
      var today = getTodayIsoDate();
      for (var rIdx = 0; rIdx < histVal.length; rIdx++) {
        if (histVal[rIdx].date === today) {
          rateVal = Number(Number(histVal[rIdx].rateBs).toFixed(4));
          break;
        }
      }

      return Object.assign({}, b, p, {
        company: mergedCompany,
        users: mergedUsers,
        rateBs: rateVal,
        rateHistory: histVal,
        reportMode: p.reportMode || "global",
        skuFilterQuery: typeof p.skuFilterQuery === "string" ? p.skuFilterQuery : "",
        skuFilterBrand: p.skuFilterBrand || "ALL",
        skuFilterCrate: p.skuFilterCrate || "ALL",
        skuFilterStock: p.skuFilterStock || "ALL",
        topSkuFromDate: p.topSkuFromDate || "2026-11-01",
        topSkuToDate: p.topSkuToDate || "2026-11-30",
        crateTypes: mergedCrateTypes,
        truckPresets: Array.isArray(p.truckPresets) && p.truckPresets.length ? p.truckPresets.map(String) : b.truckPresets,
        driverPresets: Array.isArray(p.driverPresets) && p.driverPresets.length ? p.driverPresets.map(String) : b.driverPresets,
        routePresets: Array.isArray(p.routePresets) && p.routePresets.length ? p.routePresets.map(String) : b.routePresets,
        skus: mergedSkus,
        clients: mergedClients,
        crateStock: Object.assign({}, b.crateStock, p.crateStock || {}),
        clientCrateDebt: Object.assign({}, b.clientCrateDebt, p.clientCrateDebt || {}),
        clientBalanceUsd: Object.assign({}, b.clientBalanceUsd, p.clientBalanceUsd || {}),
        collectionLog: Array.isArray(p.collectionLog) ? p.collectionLog : [],
        quarantine: Array.isArray(p.quarantine) ? p.quarantine : [],
        deletedInvoices: Array.isArray(p.deletedInvoices) ? p.deletedInvoices : [],
        consolidations: Array.isArray(p.consolidations) ? p.consolidations : b.consolidations,
        draftSaleLines: Array.isArray(p.draftSaleLines) ? p.draftSaleLines : b.draftSaleLines,
        draftPurchaseLines: Array.isArray(p.draftPurchaseLines) ? p.draftPurchaseLines : b.draftPurchaseLines
      });
    }

    function loadState() {
      var raw = getStore(STORAGE_KEY);
      if (!raw) return defaultState();
      try {
        return normalizeLoadedState(JSON.parse(raw));
      } catch (e) {
        return defaultState();
      }
    }

    var state = loadState();
    function saveState() {
      setStore(STORAGE_KEY, JSON.stringify(state));
      if (window.DistriFoodERP) window.DistriFoodERP.state = state;
      scheduleCloudSave();
    }

    function getCompany() {
      if (!state.company || typeof state.company !== "object") state.company = Object.assign({}, DEFAULT_COMPANY);
      return state.company;
    }

    function getCompanyInitials(name) {
      var words = String(name || "DF").trim().split(/\s+/).filter(Boolean);
      if (!words.length) return "DF";
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function getUsers() {
      if (!Array.isArray(state.users) || !state.users.length) state.users = cloneDefaultUsers();
      return state.users;
    }

    function getCrateTypes() {
      return Array.isArray(state.crateTypes) && state.crateTypes.length ? state.crateTypes : DEFAULT_CRATE_TYPES;

    function getPresets(kind) {
      if (kind === "truck") return Array.isArray(state.truckPresets) && state.truckPresets.length ? state.truckPresets : DEFAULT_TRUCKS;
      if (kind === "driver") return Array.isArray(state.driverPresets) && state.driverPresets.length ? state.driverPresets : DEFAULT_DRIVERS;
      if (kind === "route") return Array.isArray(state.routePresets) && state.routePresets.length ? state.routePresets : DEFAULT_ROUTES;
      return [];
    }

    function setPresetsList(kind, list) {
      if (kind === "truck") state.truckPresets = list;
      if (kind === "driver") state.driverPresets = list;
      if (kind === "route") state.routePresets = list;
    }

    function addPresetValue(kind, val) {
      var clean = String(val || "").trim();
      if (!clean) return "";
      var list = getPresets(kind).slice();
      for (var i = 0; i < list.length; i++) {
        if (list[i].toLowerCase() === clean.toLowerCase()) return list[i];
      }
      list.push(clean);
      setPresetsList(kind, list);
      return clean;
    }

    function editPresetValue(kind, oldVal, newVal) {
      var cleanNew = String(newVal || "").trim();
      if (!cleanNew) return null;
      var list = getPresets(kind).slice();
      var idx = list.indexOf(oldVal);
      if (idx === -1) {
        for (var i = 0; i < list.length; i++) {
          if (String(list[i]).toLowerCase() === String(oldVal || "").toLowerCase()) { idx = i; break; }
        }
      }
      if (idx !== -1) list[idx] = cleanNew;
      else list.push(cleanNew);
      setPresetsList(kind, list);
      if (oldVal && oldVal !== cleanNew) {
        for (var j = 0; j < state.consolidations.length; j++) {
          var c = state.consolidations[j];
          if (kind === "truck" && c.truck === oldVal) c.truck = cleanNew;
          if (kind === "driver" && c.driver === oldVal) c.driver = cleanNew;
          if (kind === "route" && c.routeZone === oldVal) c.routeZone = cleanNew;
        }
      }
      return cleanNew;
    }

    function deletePresetValue(kind, targetVal) {
      var list = getPresets(kind).slice();
      var filtered = list.filter(function (item) { return item !== targetVal; });
      if (!filtered.length) {
        var fallback = kind === "truck" ? DEFAULT_TRUCKS[0] : (kind === "driver" ? DEFAULT_DRIVERS[0] : DEFAULT_ROUTES[0]);
        filtered = [fallback];
      }
      setPresetsList(kind, filtered);
      return filtered[0];
    }

    function getTotalMercanciaCostoUsd() {
      var list = getSkus();

      for (var i = 0; i < list.length; i++) {
        total += getSkuFefoStock(list[i].sku) * Number(list[i].costUsd || 0);
      }
      return Number(total.toFixed(2));

    function allocateFefo(skuCode, neededQty) {
      var matching = state.lots
        .filter(function (l) { return l.sku === skuCode && Number(l.qty) > 0; })
        .sort(function (a, b) { return String(a.expiry).localeCompare(String(b.expiry)); });
      var totalAvail = matching.reduce(function (acc, l) { return acc + Number(l.qty); }, 0);
      if (totalAvail < neededQty) {
        return { ok: false, error: "Stock FEFO insuficiente para " + skuCode + " (disponible: " + totalAvail + ", solicitado: " + neededQty + ")." };
      }
      var rem = neededQty;
      var allocs = [];
      for (var i = 0; i < matching.length && rem > 0; i++) {
        var lot = matching[i];
        var take = Math.min(Number(lot.qty), rem);
        lot.qty = Number(lot.qty) - take;
        rem -= take;
        allocs.push({ lotId: lot.id, expiry: lot.expiry, qty: take });
      }
      return { ok: true, allocations: allocs };
    }

    function returnToFefo(skuCode, qty, preferredLotId, expiryFallback) {
      if (qty <= 0) return;
      if (preferredLotId) {
        for (var i = 0; i < state.lots.length; i++) {
          if (state.lots[i].id === preferredLotId) {
            state.lots[i].qty = Number(state.lots[i].qty || 0) + qty;
            return;
          }
        }
      }
      state.lots.push({
        id: "L-DEV-" + Math.floor(100 + Math.random() * 900),
        sku: skuCode,
        qty: qty,
        expiry: expiryFallback || "2027-03-31",
        warehouse: "Almacén Principal (Reingreso)"
      });
    }

    function ensureClientDebt(clientId) {
      if (!state.clientCrateDebt || typeof state.clientCrateDebt !== "object") state.clientCrateDebt = {};
      if (!state.clientCrateDebt[clientId] || typeof state.clientCrateDebt[clientId] !== "object") state.clientCrateDebt[clientId] = {};
      var cTypes = getCrateTypes();
      for (var i = 0; i < cTypes.length; i++) {
        var cid = cTypes[i].id;
        state.clientCrateDebt[clientId][cid] = Number(state.clientCrateDebt[clientId][cid] || 0);
      }
      if (!state.clientBalanceUsd || typeof state.clientBalanceUsd !== "object") state.clientBalanceUsd = {};
      if (typeof state.clientBalanceUsd[clientId] !== "number" || isNaN(state.clientBalanceUsd[clientId])) {
        state.clientBalanceUsd[clientId] = 0;
      }
    }

    function buildMarginalNote(clientId, delivered, returned) {
      ensureClientDebt(clientId);
      var cTypes = getCrateTypes();
      var parts = [];
      for (var i = 0; i < cTypes.length; i++) {
        var ct = cTypes[i];
        var del = Number(delivered[ct.id] || 0);
        var ret = Number(returned[ct.id] || 0);
        var net = del - ret;
        var debt = Number(state.clientCrateDebt[clientId][ct.id] || 0);
        if (net > 0) parts.push("+" + net + " " + ct.name + " entregados sin retorno (Saldo total cliente: " + debt + ")");
        else if (net < 0) parts.push(Math.abs(net) + " " + ct.name + " devueltos neto (Saldo total cliente: " + debt + ")");
        else if (ret > 0) parts.push(ret + " " + ct.name + " devueltos (Saldo total cliente: " + debt + ")");
      }
      if (!parts.length) {
        var d0 = state.clientCrateDebt[clientId];
        var sumParts = cTypes.map(function (c) { return c.name + "=" + Number(d0[c.id] || 0); });
        return "Nota Marginal Retornables: Sin movimiento nuevo. Saldo acumulado cliente: " + sumParts.join(", ") + ".";
      }
      return "Nota Marginal Retornables: " + parts.join(" | ") + ".";
    }

    function getConsolidatedInvoiceIdsSet(excludeConsId) {
      var used = {};

        if (excludeConsId && state.consolidations[i].id === excludeConsId) continue;
        var ids = state.consolidations[i].invoiceIds || [];
        for (var j = 0; j < ids.length; j++) used[ids[j]] = true;

    function calcConsSkuTotals(invoiceIds) {
      var map = {};
      for (var i = 0; i < invoiceIds.length; i++) {
        var inv = state.invoices.filter(function (x) { return x.id === invoiceIds[i]; })[0];
        if (!inv) continue;
        for (var j = 0; j < inv.items.length; j++) {
          var it = inv.items[j];
          var s = getSku(it.sku);
          if (!map[it.sku]) map[it.sku] = { sku: it.sku, name: s.name, qty: 0, weightKg: 0, totalUsd: 0 };
          var q = Number(it.qty || 0);
          map[it.sku].qty += q;
          map[it.sku].weightKg = Number((map[it.sku].weightKg + q * Number(s.weightKg || 0)).toFixed(2));
          map[it.sku].totalUsd = Number((map[it.sku].totalUsd + q * Number(it.unitPriceUsd || s.priceUsd || 0)).toFixed(2));
        }
      }
      var arr = [];
      for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) arr.push(map[k]);
      return {
        skuTotals: arr,
        grandUnits: arr.reduce(function (a, b) { return a + b.qty; }, 0),
        grandWeightKg: Number(arr.reduce(function (a, b) { return a + b.weightKg; }, 0).toFixed(2)),
        grandUsd: Number(arr.reduce(function (a, b) { return a + b.totalUsd; }, 0).toFixed(2))
      };
    }

    function countUniqueClientsForInvoices(invoiceIds) {
      var seen = {};
      var count = 0;
      for (var i = 0; i < (invoiceIds || []).length; i++) {
        var inv = state.invoices.filter(function (x) { return x.id === invoiceIds[i]; })[0];
        if (inv && inv.clientId && !seen[inv.clientId]) {
          seen[inv.clientId] = true;
          count += 1;
        }
      }
      return count;
    }

    function computeTopSellingSkus(fromDate, toDate) {
      var statsMap = {};
      var allSkus = getSkus();
      for (var sIdx = 0; sIdx < allSkus.length; sIdx++) {
        var sk = allSkus[sIdx];
        statsMap[sk.sku] = { sku: sk.sku, name: sk.name, brand: sk.brand || "General", units: 0, revenueUsd: 0, invoicesCount: 0 };
      }
      var totalUnits = 0;
      var totalRevenueUsd = 0;
      var matchedInvoices = 0;

      for (var i = 0; i < state.invoices.length; i++) {
        var inv = state.invoices[i];
        var d = String(inv.date || "");
        if (fromDate && d < fromDate) continue;
        if (toDate && d > toDate) continue;
        matchedInvoices += 1;
        var seenInInv = {};
        for (var j = 0; j < (inv.items || []).length; j++) {
          var it = inv.items[j];
          if (!statsMap[it.sku]) {
            var refSku = getSku(it.sku);
            statsMap[it.sku] = { sku: it.sku, name: refSku.name, brand: refSku.brand || "General", units: 0, revenueUsd: 0, invoicesCount: 0 };
          }
          var q = Number(it.qty || 0);
          var sub = q * Number(it.unitPriceUsd || getSku(it.sku).priceUsd || 0);
          statsMap[it.sku].units += q;
          statsMap[it.sku].revenueUsd = Number((statsMap[it.sku].revenueUsd + sub).toFixed(2));
          if (!seenInInv[it.sku]) {
            statsMap[it.sku].invoicesCount += 1;
            seenInInv[it.sku] = true;
          }
          totalUnits += q;
          totalRevenueUsd = Number((totalRevenueUsd + sub).toFixed(2));
        }
      }

      var list = [];
      for (var key in statsMap) {
        if (Object.prototype.hasOwnProperty.call(statsMap, key)) {
          var row = statsMap[key];
          row.sharePct = totalUnits > 0 ? ((row.units / totalUnits) * 100) : 0;
          list.push(row);
        }
      }
      list.sort(function (a, b) {
        if (b.units !== a.units) return b.units - a.units;
        return b.revenueUsd - a.revenueUsd;
      });

      return { items: list, totalUnits: totalUnits, totalRevenueUsd: totalRevenueUsd, matchedInvoices: matchedInvoices };
    }

      function submitLogin() {
        var identVal = idInp ? idInp.value : "";
        var passVal = passInp ? String(passInp.value || "") : "";
        var matched = findUserByIdentifier(identVal);

        if (!matched) {
          if (errEl) errEl.textContent = "Usuario o correo no encontrado.";
          if (idInp) idInp.focus();
          return;
        }
        if (matched.active === false) {
          if (errEl) errEl.textContent = "El usuario '" + matched.name + "' está inactivo.";
          return;
        }
        var expectedPass = String(matched.password != null ? matched.password : "1234");
        if (passVal !== expectedPass) {
          if (errEl) errEl.textContent = "Clave incorrecta.";
          if (passInp) { passInp.value = ""; passInp.focus(); }
          return;
        }
        activateUserSession(matched, true);
      }

      document.getElementById("btn-do-login").onclick = submitLogin;
      if (idInp) {
        idInp.onkeydown = function (ev) {
          if (ev.key === "Enter") { ev.preventDefault(); submitLogin(); }
        };
      }
      if (passInp) {
        passInp.onkeydown = function (ev) {
          if (ev.key === "Enter") { ev.preventDefault(); submitLogin(); }
        };
      }
    }

    function safeRun(fn, root) {
      try {
        fn(root);
      } catch (err) {
        if (root) {
          root.innerHTML = '<div class="card"><h2 class="card-title">Error en el módulo actual</h2><p class="muted">' + esc(err && err.message ? err.message : String(err)) + '</p><button type="button" class="primary sm" id="btn-recover-view">Restablecer Datos Demo</button></div>';
          var rec = document.getElementById("btn-recover-view");
          if (rec) rec.onclick = function () { delStore(STORAGE_KEY); state = defaultState(); render(); };
        }
      }
    }

    function render() {
      try { renderTopbar(); } catch (e) {}
      try { renderNav(); } catch (e) {}
      try { renderNotice(); } catch (e) {}

      var root = document.getElementById("app-root");
      if (!root) return;

      if (!state.isLoggedIn) {
        safeRun(renderLoginView, root);
        return;
      }

      var allowedTabs = getUserAllowedTabs(getUser());
      if (allowedTabs.indexOf(state.activeTab) === -1) {
        state.activeTab = allowedTabs[0] || "ventas";
      }

      var activeModule = MENU_MODULES[state.activeTab] || MENU_MODULES.ventas;
      safeRun(activeModule, root);
    }

    function syncFromCloud(forceRender) {
      if (!hasSupabaseConfig()) {
        setCloudStatus("local");
        if (forceRender) render();
        return;
      }
      fetchCloudState().then(function (remoteObj) {
        if (!remoteObj) {
          pushCloudStateNow();
          if (forceRender) render();
          return;
        }
        isApplyingRemoteState = true;
        state = normalizeLoadedState(remoteObj);
        setStore(STORAGE_KEY, JSON.stringify(state));
        if (window.DistriFoodERP) window.DistriFoodERP.state = state;
        isApplyingRemoteState = false;
        setCloudStatus("synced");
        render();
      });
    }

    function bootApp() {
      render();
      syncFromCloud(false);
    }

    window.DistriFoodERP = {
      state: state,
      ALL_PERMS: ALL_PERMS,
      ROLE_PERMS: ROLE_PERMS,
      DEFAULT_CRATE_TYPES: DEFAULT_CRATE_TYPES,
      registerMenuModule: registerMenuModule,
      saveState: saveState,
      render: render,
      setNotice: setNotice,
      openModal: openModal,
      closeModal: closeModal,
      esc: esc,
      fmtUsd: fmtUsd,
      fmtBs: fmtBs,
      fmtRawBs: fmtRawBs,
      getTodayIsoDate: getTodayIsoDate,
      normalizeRateHistory: normalizeRateHistory,
      recordDailyRate: recordDailyRate,
      deleteRateHistoryEntry: deleteRateHistoryEntry,
      getCompany: getCompany,
      getCompanyInitials: getCompanyInitials,
      getUsers: getUsers,
      getUser: getUser,
      hasPerm: hasPerm,
      getSkus: getSkus,
      getSku: getSku,
      getSkuPriceForClientType: getSkuPriceForClientType,
      getSkuFefoStock: getSkuFefoStock,
      getTotalMercanciaCostoUsd: getTotalMercanciaCostoUsd,
      getClients: getClients,
      getClient: getClient,
      clientTypeBadgeClass: clientTypeBadgeClass,
      ensureClientDebt: ensureClientDebt,
      formatClientCratesSummary: formatClientCratesSummary,
      getCrateTypes: getCrateTypes,
      getCrateType: getCrateType,
      normalizeCrateKey: normalizeCrateKey,
      getPresets: getPresets,
      addPresetValue: addPresetValue,
      openAddPresetModal: openAddPresetModal,
      openEditPresetModal: openEditPresetModal,
      handleDeletePreset: handleDeletePreset,
      openNewClientModal: openNewClientModal,
      openEditClientModal: openEditClientModal,
      allocateFefo: allocateFefo,
      returnToFefo: returnToFefo,
      buildMarginalNote: buildMarginalNote,
      getConsolidatedInvoiceIdsSet: getConsolidatedInvoiceIdsSet,
      calcConsSkuTotals: calcConsSkuTotals,
      countUniqueClientsForInvoices: countUniqueClientsForInvoices,
      computeTopSellingSkus: computeTopSellingSkus,
      syncFromCloud: syncFromCloud
    };

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        syncFromCloud(false);
      }
    });

    document.addEventListener("DOMContentLoaded", bootApp);
    if (document.readyState === "complete" || document.readyState === "interactive") {
      setTimeout(bootApp, 0);
    }
  })();
  </script>
